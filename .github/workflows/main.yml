name: Build Unsigned iOS IPA

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP automatically
        run: |
          if [ ! -f "package.json" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              unzip -o "$ZIP_FILE" -d .
            fi
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor & Generate iOS Project
        run: |
          npm install
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Generate App Icons
        run: |
          mkdir -p assets
          cp icon-1024.png assets/icon.png || true
          cp icon-1024.png assets/splash.png || true
          npx capacitor-assets generate --ios || true

      - name: Build Unsigned .app with Xcode
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO PROVISIONING_PROFILE_SPECIFIER="" DEVELOPMENT_TEAM="" clean build || xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO PROVISIONING_PROFILE_SPECIFIER="" DEVELOPMENT_TEAM="" clean build

      - name: Package Payload into .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/App/build -name "App.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -qry MergeStudio-Unsigned.ipa Payload

      - name: Upload Unsigned IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MergeStudio-Unsigned-IPA
          path: MergeStudio-Unsigned.ipa
